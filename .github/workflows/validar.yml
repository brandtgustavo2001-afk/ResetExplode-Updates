name: Validar aplicativo
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/StressPolicyTests.csproj -c Release
      - run: dotnet run --project tests/UpdaterTests.csproj -c Release
      - run: dotnet run --project tests/MonitoringTests.csproj -c Release
      - run: dotnet build ResetExplode.csproj -c Release --nologo
